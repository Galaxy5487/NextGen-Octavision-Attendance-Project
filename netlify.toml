[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirect /api/* to Netlify serverless function api
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React Router SPA catch-all redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
